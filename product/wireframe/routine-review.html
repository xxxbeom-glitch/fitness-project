<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Fit 추천 루틴 검토안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:#fffffff5;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{font-size:12px;color:#6f7782}.top a{padding:7px 10px;border:1px solid #d8dce1;border-radius:6px;background:#fff;color:#39414a;text-decoration:none;font-size:12px}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:800;color:#6c7480}.head h1{margin:6px 0;font-size:28px}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{padding:7px 10px;border-radius:999px;background:#fff4d8;color:#805d00;font-size:11px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:800;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:470px minmax(0,1fr);border:1px solid #cfd4da;background:#fff}.preview{display:flex;justify-content:center;padding:28px 24px 36px;border-right:1px solid #d8dce1;background:#fafbfc}.phone{position:relative;width:360px;min-height:790px;padding:0 20px 34px;overflow:hidden;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#c8c8cc;font-size:11px}.appbar{height:52px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}.appbar span{font-size:14px;font-weight:800}.back{color:#aaa}.hero{padding:18px;border:1px solid #2d2d31;border-radius:14px;background:#161618}.hero small{color:#34d399;font-size:10px;font-weight:800}.hero h2{margin:7px 0 5px;font-size:23px}.hero p{margin:0;color:#8e8e93;font-size:11px;line-height:1.5}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.meta span{padding:5px 8px;border-radius:7px;background:#222226;color:#aaa;font-size:10px}.section{display:flex;justify-content:space-between;margin:20px 0 8px}.section b{font-size:13px}.section span{font-size:10px;color:#777}.exercise{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:9px;min-height:52px;padding:8px 10px;margin-bottom:6px;border-radius:10px;background:#161618}.exercise i{font-style:normal;color:#6f6f76;font-size:10px}.exercise b{font-size:12px}.exercise small{display:block;margin-top:3px;color:#8e8e93;font-size:10px}.exercise strong{color:#b9b9bf;font-size:10px}.cta{width:100%;height:48px;margin-top:16px;border:0;border-radius:10px;background:#34d399;color:#07130e;font-weight:900;cursor:pointer}.sub{width:100%;height:40px;margin-top:8px;border:1px solid #38383d;border-radius:10px;background:transparent;color:#cfcfd4;font-size:11px;font-weight:800}.hint{margin-top:8px;text-align:center;color:#73737b;font-size:9px}.saved{margin-top:16px;padding:14px;border:1px solid #2f6f59;border-radius:11px;background:#10211b}.saved b{display:block;color:#73dfb5;font-size:12px}.saved p{margin:4px 0 0;color:#9db9ad;font-size:10px;line-height:1.5}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 22px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:16px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:7px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.compare{margin-top:18px;border:1px solid #d7dbe0;border-radius:10px;overflow:hidden}.compare div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 12px;border-bottom:1px solid #e2e5e8;font-size:12px;line-height:1.5}.compare div:last-child{border:0}.compare span{color:#626a74}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){main{padding:18px 8px}.top{padding:11px 12px}.preview{padding:18px 4px}.phone{width:350px;max-width:100%}.notes{padding:18px 14px}}</style></head><body><header class="top"><div><b>G FIT</b> <span>추천 루틴 이해용 검토안</span></div><a href="./index.html#routine">전체 와이어프레임</a></header><main><div class="head"><div><small>RECOMMENDED ROUTINE · REVIEW ONLY</small><h1>추천 루틴을 눌렀을 때 어떻게 시작할까?</h1><p>루틴 내용은 먼저 보여주고, 그다음 저장과 운동 시작을 어떻게 연결할지 비교합니다.</p></div><div class="badge">아직 확정 아님</div></div><div class="tabs"><button class="on" data-m="auto">추천안 · 시작하면 자동 저장</button><button data-m="save">비교 · 먼저 저장</button><button data-m="direct">비교 · 바로 시작</button></div><section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section></main><script>const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),dc=document.getElementById('dec');const list=`<div class="section"><b>운동 구성</b><span>6개 운동</span></div><div class="exercise"><i>01</i><div><b>벤치프레스</b><small>3세트 · 8–12회</small></div><strong>가슴</strong></div><div class="exercise"><i>02</i><div><b>랫풀다운</b><small>3세트 · 8–12회</small></div><strong>등</strong></div><div class="exercise"><i>03</i><div><b>레그프레스</b><small>3세트 · 10–15회</small></div><strong>하체</strong></div><div class="exercise"><i>04</i><div><b>숄더프레스</b><small>3세트 · 8–12회</small></div><strong>어깨</strong></div>`;const shell=x=>`<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="appbar"><span class="back">‹</span><span>추천 루틴</span><span></span></div><div class="hero"><small>G Fit 추천</small><h2>무분할 전신 루틴</h2><p>큰 근육을 한 번에 훈련하는 기본 구성입니다.</p><div class="meta"><span>6개 운동</span><span>18세트</span><span>약 50분</span></div></div>${list}${x}`;function auto(){p.innerHTML=shell(`<button class="cta" id="go">이 루틴으로 운동 시작</button><div class="hint">시작하면 내 루틴에도 자동 저장됩니다.</div><button class="sub">나중에 하기</button><div class="saved" id="saved" style="display:none"><b>내 루틴에 저장했어요</b><p>운동을 시작합니다. 다음에도 같은 루틴을 사용할 수 있어요.</p></div>`);document.getElementById('go').onclick=()=>document.getElementById('saved').style.display='block';nt.textContent='추천안 · 운동 시작을 가장 빠르게';nl.innerHTML='내용을 확인한 뒤 <strong>운동 시작 버튼 하나</strong>로 바로 들어갑니다. 시작한 루틴은 자동으로 내 루틴에도 저장합니다.';rs.innerHTML='<div class="rule"><b>왜 추천하나</b><p>사용자가 운동하려고 들어왔을 때 저장 버튼을 따로 누르는 단계를 줄일 수 있습니다.</p></div><div class="rule"><b>자동 저장은 숨기지 않음</b><p>버튼 아래에 “시작하면 내 루틴에도 자동 저장”이라고 미리 알려줍니다.</p></div><div class="compare"><div><b>장점</b><span>상세 확인 → 운동 시작이 빠르고, 다음 운동에서도 재사용 가능.</span></div><div><b>주의점</b><span>한 번만 시험하려던 사용자에게 내 루틴이 늘어날 수 있음.</span></div></div>';dc.innerHTML='추천 루틴을 쓸 때 <strong>운동 시작과 저장을 한 번에 처리</strong>하는 방식이 좋은가?' }function save(){p.innerHTML=shell(`<button class="cta">내 루틴에 추가</button><button class="sub">취소</button><div class="saved"><b>저장 후 한 단계 더</b><p>저장한 다음 내 루틴 상세로 이동해 다시 ‘운동 시작’을 눌러야 합니다.</p></div>`);nt.textContent='비교안 · 먼저 저장';nl.innerHTML='의미는 가장 명확하지만 <strong>운동을 시작하기까지 한 단계가 더 생기는 방식</strong>입니다.';rs.innerHTML='<div class="rule"><b>좋은 점</b><p>저장과 운동 시작이 완전히 분리되어 사용자가 무엇을 하는지 명확합니다.</p></div><div class="rule"><b>아쉬운 점</b><p>운동하려는 사용자가 저장 후 다시 시작 버튼을 눌러야 합니다.</p></div>';dc.innerHTML='명확함을 위해 <strong>한 단계를 더 허용할지</strong> 보면 됩니다.'}function direct(){p.innerHTML=shell(`<button class="cta">지금 운동 시작</button><button class="sub">내 루틴에 저장</button><div class="hint">운동만 시작하면 자동 저장되지 않습니다.</div>`);nt.textContent='비교안 · 운동만 바로 시작';nl.innerHTML='저장하지 않고 <strong>이번 한 번만 바로 운동</strong>할 수 있게 하는 방식입니다.';rs.innerHTML='<div class="rule"><b>좋은 점</b><p>시험 삼아 한 번 해보려는 사람에게 부담이 없습니다.</p></div><div class="rule"><b>아쉬운 점</b><p>마음에 들어 다시 쓰려면 사용자가 저장을 따로 기억해야 하고 버튼이 두 개라 선택이 늘어납니다.</p></div>';dc.innerHTML='추천 루틴을 <strong>일회성 운동과 저장 루틴으로 분리</strong>할 필요가 있는지 보면 됩니다.'}function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='auto'?auto():m==='save'?save():direct()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('auto');</script></body></html>
