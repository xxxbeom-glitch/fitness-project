<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Fit 추천 루틴 저장 검토안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:#fffffff5;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{font-size:12px;color:#6f7782}.top a{padding:7px 10px;border:1px solid #d8dce1;border-radius:6px;background:#fff;color:#39414a;text-decoration:none;font-size:12px}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:800;color:#6c7480}.head h1{margin:6px 0;font-size:28px;line-height:1.25}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{padding:7px 10px;border-radius:999px;background:#fff4d8;color:#805d00;font-size:11px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:800;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:470px minmax(0,1fr);border:1px solid #cfd4da;background:#fff}.preview{display:flex;justify-content:center;padding:28px 24px 36px;border-right:1px solid #d8dce1;background:#fafbfc}.phone{position:relative;width:360px;min-height:790px;padding:0 20px 34px;overflow:hidden;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#c8c8cc;font-size:11px}.appbar{height:52px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}.appbar span{font-size:14px;font-weight:800}.back{color:#aaa}.hero{padding:18px;border:1px solid #2d2d31;border-radius:14px;background:#161618}.hero small{color:#34d399;font-size:10px;font-weight:800}.hero h2{margin:7px 0 5px;font-size:23px}.hero p{margin:0;color:#8e8e93;font-size:11px;line-height:1.5}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.meta span{padding:5px 8px;border-radius:7px;background:#222226;color:#aaa;font-size:10px}.section{display:flex;justify-content:space-between;margin:20px 0 8px}.section b{font-size:13px}.section span{font-size:10px;color:#777}.exercise{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:9px;min-height:52px;padding:8px 10px;margin-bottom:6px;border-radius:10px;background:#161618}.exercise i{font-style:normal;color:#6f6f76;font-size:10px}.exercise b{font-size:12px}.exercise small{display:block;margin-top:3px;color:#8e8e93;font-size:10px}.exercise strong{color:#b9b9bf;font-size:10px}.cta{width:100%;height:48px;margin-top:16px;border:0;border-radius:10px;background:#34d399;color:#07130e;font-weight:900;cursor:pointer}.sub{width:100%;height:42px;margin-top:8px;border:1px solid #38383d;border-radius:10px;background:transparent;color:#cfcfd4;font-size:11px;font-weight:800;cursor:pointer}.ghost{width:100%;height:36px;margin-top:6px;border:0;background:transparent;color:#7d7d85;font-size:10px;font-weight:800;cursor:pointer}.hint{margin-top:9px;text-align:center;color:#73737b;font-size:9px;line-height:1.5}.complete{padding:20px 18px;border:1px solid #2d2d31;border-radius:14px;background:#161618;text-align:center}.complete .check{width:48px;height:48px;margin:0 auto 10px;display:grid;place-items:center;border-radius:50%;background:#173d30;color:#69deb1;font-size:22px}.complete h2{margin:0 0 5px;font-size:21px}.complete p{margin:0;color:#8e8e93;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.metric{padding:10px 5px;border-radius:9px;background:#202024}.metric b{display:block;font-size:14px}.metric small{color:#85858c;font-size:9px}.savebox{margin-top:14px;padding:15px;border:1px solid #315d4d;border-radius:12px;background:#10211b}.savebox h3{margin:0 0 5px;font-size:15px}.savebox p{margin:0;color:#9db9ad;font-size:10px;line-height:1.5}.recordnote{margin-top:10px;padding:9px 10px;border-radius:9px;background:#202024;color:#aaa;font-size:9px;line-height:1.5}.changes{margin-top:13px;padding:12px;border-radius:10px;background:#202024}.changes b{display:block;margin-bottom:6px;font-size:11px}.change{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #303036;font-size:10px}.change:first-of-type{border-top:0}.change span{color:#8e8e93}.change strong{color:#d8d8dd}.result{display:none;margin-top:10px;padding:11px;border:1px solid #315d4d;border-radius:9px;background:#10211b;color:#9fd7c0;font-size:10px;line-height:1.5}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 22px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:16px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:7px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.rule strong{color:#12704f}.flow{margin-top:18px;border:1px solid #d7dbe0;border-radius:10px;overflow:hidden}.flow div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:11px 12px;border-bottom:1px solid #e2e5e8;font-size:12px;line-height:1.5}.flow div:last-child{border:0}.flow span{color:#626a74}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){main{padding:18px 8px}.top{padding:11px 12px}.preview{padding:18px 4px}.phone{width:350px;max-width:100%}.notes{padding:18px 14px}}</style></head><body><header class="top"><div><b>G FIT</b> <span>추천 루틴 저장 흐름 검토안</span></div><a href="./index.html#routine">전체 와이어프레임</a></header><main><div class="head"><div><small>RECOMMENDED ROUTINE · REVIEW ONLY</small><h1>추천 루틴은 먼저 해보고, 끝난 뒤 저장할지 정한다</h1><p>운동 시작만으로 내 루틴에 저장하지 않습니다. 운동 기록과 루틴 저장도 서로 분리합니다.</p></div><div class="badge">검토안</div></div><div class="tabs"><button class="on" data-m="start">1. 운동 시작</button><button data-m="finish">2. 그대로 완료</button><button data-m="changed">3. 바꿔서 완료</button></div><section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section></main><script>const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),dc=document.getElementById('dec');const exercises=`<div class="section"><b>운동 구성</b><span>6개 운동</span></div><div class="exercise"><i>01</i><div><b>벤치프레스</b><small>3세트 · 8–12회</small></div><strong>가슴</strong></div><div class="exercise"><i>02</i><div><b>랫풀다운</b><small>3세트 · 8–12회</small></div><strong>등</strong></div><div class="exercise"><i>03</i><div><b>레그프레스</b><small>3세트 · 10–15회</small></div><strong>하체</strong></div><div class="exercise"><i>04</i><div><b>숄더프레스</b><small>3세트 · 8–12회</small></div><strong>어깨</strong></div>`;function shell(x,title='추천 루틴'){return `<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="appbar"><span class="back">‹</span><span>${title}</span><span></span></div>${x}`};function start(){p.innerHTML=shell(`<div class="hero"><small>G Fit 추천</small><h2>무분할 전신 루틴</h2><p>큰 근육을 한 번에 훈련하는 기본 구성입니다.</p><div class="meta"><span>6개 운동</span><span>18세트</span><span>약 50분</span></div></div>${exercises}<button class="cta">이 루틴으로 운동 시작</button><div class="hint">운동을 시작해도 아직 '내 루틴'에는 저장되지 않습니다.</div>`);nt.textContent='1단계 · 저장 없이 바로 운동';nl.innerHTML='추천 루틴의 내용을 보고 괜찮으면 <strong>그냥 운동부터 시작</strong>합니다.';rs.innerHTML='<div class="rule"><b>자동 저장 없음</b><p>추천 카드를 눌렀거나 운동을 시작했다는 이유만으로 내 루틴이 늘어나지 않습니다.</p></div><div class="rule"><b>오늘 운동 기록은 별개</b><p>운동 중 입력한 중량·횟수·완료 세트는 평소처럼 운동 기록으로 남습니다.</p></div><div class="flow"><div><b>추천 루틴</b><span>내용 확인</span></div><div><b>운동 시작</b><span>내 루틴 저장 안 됨</span></div><div><b>운동 완료</b><span>그때 저장 여부 선택</span></div></div>';dc.innerHTML='<strong>추천 루틴을 시험해본 뒤 판단</strong>하는 흐름이 자연스러운지 보면 됩니다.'}function finish(){p.innerHTML=shell(`<div class="complete"><div class="check">✓</div><h2>운동 완료</h2><p>무분할 전신 루틴을 마쳤어요.</p><div class="metrics"><div class="metric"><b>52분</b><small>운동 시간</small></div><div class="metric"><b>18</b><small>완료 세트</small></div><div class="metric"><b>6</b><small>운동 종목</small></div></div></div><div class="savebox"><h3>이 루틴, 다음에도 할까요?</h3><p>마음에 들었다면 내 루틴에 저장해서 다음에도 바로 사용할 수 있어요.</p><button class="cta" id="save">내 루틴에 저장</button><button class="sub" id="once">이번만 하기</button><div class="recordnote">중요: 어떤 버튼을 눌러도 <b>오늘 운동 기록은 이미 저장</b>됩니다.</div><div class="result" id="result"></div></div>`,'운동 완료');const r=document.getElementById('result');document.getElementById('save').onclick=()=>{r.style.display='block';r.textContent='내 루틴에 저장했어요. 다음에도 같은 구성을 사용할 수 있습니다.'};document.getElementById('once').onclick=()=>{r.style.display='block';r.textContent='루틴은 저장하지 않았어요. 오늘 운동 기록만 남습니다.'};nt.textContent='2단계 · 끝나고 사용자가 결정';nl.innerHTML='추천 루틴을 그대로 끝냈다면 <strong>저장 / 이번만 하기</strong> 두 가지만 묻습니다.';rs.innerHTML='<div class="rule"><b>운동 기록은 항상 남음</b><p>루틴 저장을 거절해도 오늘 실제로 한 운동은 사라지지 않습니다.</p></div><div class="rule"><b>내 루틴은 사용자가 선택</b><p>한 번 해보고 마음에 든 루틴만 내 루틴에 추가됩니다.</p></div><div class="rule"><b>질문은 운동 끝난 뒤 한 번</b><p>운동 전에는 저장 여부를 고민하지 않아도 됩니다.</p></div>';dc.innerHTML='이 기본 흐름은 <strong>“내 루틴에 저장 / 이번만 하기”</strong> 두 선택이면 충분한지 보면 됩니다.'}function changed(){p.innerHTML=shell(`<div class="complete"><div class="check">✓</div><h2>운동 완료</h2><p>오늘은 추천 구성에서 일부를 바꿔 운동했어요.</p></div><div class="changes"><b>오늘 바꾼 내용</b><div class="change"><span>운동 변경</span><strong>레그프레스 → 핵스쿼트</strong></div><div class="change"><span>세트 수</span><strong>18세트 → 16세트</strong></div></div><div class="savebox"><h3>어떤 구성으로 저장할까요?</h3><p>오늘 실제로 한 구성과 원래 추천 구성 중에서 고를 수 있어요.</p><button class="cta" id="today">오늘 한 구성으로 저장</button><button class="sub" id="original">원래 추천 구성으로 저장</button><button class="ghost" id="skip">루틴 저장 안 함</button><div class="recordnote">오늘 운동 기록은 이 선택과 상관없이 실제 수행 내용 그대로 저장됩니다.</div><div class="result" id="result"></div></div>`,'운동 완료');const r=document.getElementById('result');document.getElementById('today').onclick=()=>{r.style.display='block';r.textContent='오늘 바꿔서 수행한 구성을 새 루틴으로 저장합니다.'};document.getElementById('original').onclick=()=>{r.style.display='block';r.textContent='G Fit이 원래 제공한 추천 구성을 내 루틴에 저장합니다.'};document.getElementById('skip').onclick=()=>{r.style.display='block';r.textContent='루틴은 저장하지 않고 오늘 운동 기록만 남깁니다.'};nt.textContent='예외 · 운동 중 구성을 바꿨다면';nl.innerHTML='이 경우에만 저장할 때 <strong>무엇을 루틴으로 남길지</strong> 한 번 더 선택해야 합니다.';rs.innerHTML='<div class="rule"><b>왜 추가 선택이 필요한가</b><p>운동 중 운동 교체·삭제·세트 변경을 허용하기 때문에 “추천 루틴”과 “실제로 한 루틴”이 달라질 수 있습니다.</p></div><div class="rule"><b>운동 기록과는 무관</b><p>오늘 기록은 실제 수행 내용으로 이미 저장되고, 여기서는 다음에 다시 쓸 루틴 모양만 정합니다.</p></div><div class="rule"><b>매번 묻지는 않음</b><p>구성 변경이 있었을 때만 이 선택을 보여줘서 평소 완료 화면은 단순하게 유지합니다.</p></div>';dc.innerHTML='구성을 바꾼 날에만 <strong>오늘 구성 / 원래 구성 / 저장 안 함</strong>을 묻는 게 이해하기 쉬운지 보면 됩니다.'}function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='start'?start():m==='finish'?finish():changed()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('start');</script></body></html>
