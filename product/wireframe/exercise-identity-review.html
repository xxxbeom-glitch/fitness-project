<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Fit 운동 구분 기준 검토안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:Pretendard,SUIT,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fff;padding:14px 24px;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{margin-left:8px;font-size:12px;color:#6f7782}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:900;color:#6c7480}.head h1{margin:6px 0;font-size:28px}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{height:max-content;padding:7px 10px;border-radius:999px;background:#eaf9f3;color:#13714f;font-size:11px;font-weight:900}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:900;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:490px 1fr;background:#fff;border:1px solid #cfd4da}.preview{padding:28px 24px 36px;background:#fafbfc;border-right:1px solid #d8dce1}.phone{width:380px;max-width:100%;min-height:720px;margin:auto;padding:0 18px 28px;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#bbb;font-size:11px}.appbar{height:48px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;font-size:14px;font-weight:900}.card{padding:13px;margin-bottom:9px;border:1px solid #26262b;border-radius:12px;background:#161618}.card h3{margin:0 0 5px;font-size:13px}.muted{color:#8e8e93;font-size:10px;line-height:1.45}.family{padding:11px 12px;margin:10px 0;border:1px solid #315d4d;border-radius:10px;background:#10211b;color:#75e3b7;font-size:12px;font-weight:900}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 12px;margin-bottom:7px;border:1px solid #222228;border-radius:10px;background:#161618}.row b{font-size:12px}.row small{display:block;margin-top:3px;color:#8e8e93;font-size:10px}.rec{font-size:10px;color:#bfc3c8}.tag{display:inline-block;margin:3px 4px 0 0;padding:5px 7px;border-radius:999px;background:#222227;color:#bfc3c8;font-size:9px}.branch{margin:8px 0 0 12px;padding-left:12px;border-left:2px solid #303036}.branch div{padding:7px 0;font-size:11px}.good{color:#69deb1}.warn{color:#ffcc73}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 20px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:15px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:6px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.matrix{margin-top:16px;border:1px solid #d7dbe0;border-radius:10px;overflow:hidden}.matrix div{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 12px;border-bottom:1px solid #e2e5e8;font-size:12px;line-height:1.45}.matrix div:last-child{border-bottom:0}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{flex-direction:column}}</style></head><body><header class="top"><b>G FIT</b><span>운동 DB · 같은 운동 / 다른 운동 검토안</span></header><main><div class="head"><div><small>EXERCISE IDENTITY · REVIEW ONLY</small><h1>기록을 어디까지 같은 운동으로 묶을까?</h1><p>검색 목록은 단순하게 유지하되, 과거 기록이 뒤섞이지 않도록 기준을 잡습니다.</p></div><div class="badge">추천안</div></div><div class="tabs"><button class="on" data-m="base">추천안 · 3단 구조</button><button data-m="machine">브랜드 머신</button><button data-m="grip">그립 차이</button><button data-m="naming">이름 / 중복 정리</button></div><section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="matrix" id="matrix"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section></main><script>const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),mx=document.getElementById('matrix'),dc=document.getElementById('dec');const shell=x=>`<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="appbar"><span>‹</span><span>운동 구분</span><span></span></div>${x}`;function base(){p.innerHTML=shell(`<div class="family">운동 계열 · 벤치프레스/수평 밀기</div>${row('바벨 벤치프레스','최근 80kg × 8','바벨')}${row('덤벨 벤치프레스','최근 30kg × 10','덤벨')}${row('스미스 머신 벤치프레스','최근 70kg × 10','스미스')}${row('체스트 프레스 머신','최근 55kg × 12','머신')}${row('케이블 벤치프레스','최근 25kg × 12','케이블')}<div class="card"><h3>왜 나누나?</h3><div class="muted">같은 가슴 밀기 계열이어도 기구와 저항 방식이 달라 kg 기록을 직접 비교하기 어렵기 때문입니다.</div></div>`);nt.textContent='추천안 · 화면은 단순, 기록은 정확하게';nl.innerHTML='<strong>운동 계열 → 기록 운동 → 세부 변형</strong>의 3단 구조를 추천합니다.';rs.innerHTML='<div class="rule"><b>1. 운동 계열</b><p>추천·대체운동·분석에서 비슷한 운동을 묶는 용도입니다. 계열 자체에는 kg 기록을 쌓지 않습니다.</p></div><div class="rule"><b>2. 기록 운동</b><p>사용자가 실제로 선택하는 운동입니다. 바벨/덤벨/스미스/머신/케이블처럼 기록값이 직접 비교되기 어려우면 별도 기록으로 둡니다.</p></div><div class="rule"><b>3. 세부 변형</b><p>브랜드 머신, 손잡이, 그립처럼 모든 사용자가 필요하지 않은 정보는 아래 단계로 둡니다.</p></div>';mx.innerHTML='<div><b>무조건 분리</b><span>장비 방식, 각도/동작 경로, 한쪽/양쪽, 보조/자중 등 기록 방법이 달라지는 경우</span></div><div><b>보통 합침</b><span>시트 높이, 손잡이 위치, 작은 자세 차이, 단순 이름 차이</span></div>';dc.innerHTML='<strong>같은 부위/동작이라는 이유만으로 기록을 합치지 않는 것</strong>이 핵심입니다.'}function row(n,r,t){return `<div class="row"><div><b>${n}</b><small><span class="tag">${t}</span></small></div><span class="rec">${r}</span></div>`}function machine(){p.innerHTML=shell(`<div class="family">기록 운동 · 체스트 프레스 머신</div><div class="card"><h3>기본</h3><div class="muted">체스트 프레스 머신 · 일반 기록</div></div><div class="branch"><div><span class="good">●</span> Hammer Strength를 따로 기록하고 싶음</div><div><span class="good">●</span> Cybex를 따로 기록하고 싶음</div><div><span class="warn">○</span> 브랜드를 모르면 그냥 기본 운동 사용</div></div><div class="card" style="margin-top:16px"><h3>MVP 제안</h3><div class="muted">브랜드별 전체 목록을 미리 만들지 않습니다. 필요하면 ‘직접 만든 운동’으로 별도 기록하고, 나중에 같은 계열로 연결할 수 있게 합니다.</div></div>`);nt.textContent='브랜드 머신 · 기록 정확도와 목록 폭증 사이';nl.innerHTML='머신마다 실제 저항감과 표시 중량의 의미가 다를 수 있지만, <strong>모든 브랜드/모델을 기본 목록에 펼치면 검색이 망가집니다.</strong>';rs.innerHTML='<div class="rule"><b>기본값</b><p>사용자는 먼저 일반적인 ‘체스트 프레스 머신’을 봅니다.</p></div><div class="rule"><b>별도 기록이 필요한 사람</b><p>Hammer Strength 같은 특정 기구를 계속 추적하고 싶다면 별도 운동 기록으로 만들 수 있게 합니다.</p></div><div class="rule"><b>첫 출시에서는</b><p>브랜드 선택기를 따로 만들기보다 기존 ‘직접 만들기’를 이용합니다. 제조사 DB는 나중에 확장합니다.</p></div>';mx.innerHTML='<div><b>장점</b><span>검색 목록이 복잡해지지 않고, 원하는 사용자는 기록을 분리할 수 있음</span></div><div><b>위험</b><span>같은 사용자가 generic/브랜드 운동을 섞어 쓰면 기록이 나뉠 수 있음</span></div>';dc.innerHTML='브랜드/모델은 <strong>기본 운동 목록을 늘리는 축이 아니라 선택적 별도 기록</strong>으로 두는 것을 추천합니다.'}function grip(){p.innerHTML=shell(`<div class="family">랫풀다운 계열</div>${row('랫풀다운','최근 60kg × 10','기본')}${row('내로우 그립 랫풀다운','최근 65kg × 10','명확한 변형')}<div class="card"><h3>세세한 그립은?</h3><div class="muted">손잡이 폭을 조금 바꿈 / 손목 각도를 조금 바꿈 → 별도 운동을 새로 만들지 않고 필요하면 메모나 속성으로 남김.</div></div><div class="family">벤치프레스 계열</div>${row('바벨 벤치프레스','80kg × 8','기본')}${row('클로즈 그립 벤치프레스','70kg × 10','명확한 변형')}`);nt.textContent='그립 · 전부 쪼개지도, 전부 합치지도 않기';nl.innerHTML='그립이라는 이유만으로 전부 별도 운동으로 만들면 목록이 폭발합니다. 반대로 <strong>클로즈 그립 벤치프레스처럼 운동 이름과 수행 목적 자체가 굳어진 변형</strong>까지 합치면 기록이 섞입니다.';rs.innerHTML='<div class="rule"><b>별도 운동으로 분리</b><p>이름이 독립적으로 쓰이고, 세팅/수행 방식이 명확히 달라 사용자가 따로 진행 상황을 보고 싶을 가능성이 높은 경우.</p></div><div class="rule"><b>속성/메모로 처리</b><p>같은 운동에서 손잡이 폭이나 각도를 조금 조절한 정도.</p></div>';mx.innerHTML='<div><b>분리 예</b><span>클로즈 그립 벤치프레스, 내로우 그립 랫풀다운, 언더핸드 로우</span></div><div><b>합침 예</b><span>같은 랫풀다운에서 손 위치를 손가락 한두 마디 바꾼 정도</span></div>';dc.innerHTML='<strong>‘그립이 다르면 무조건 다른 운동’ 규칙은 쓰지 않는 것</strong>을 추천합니다.'}function naming(){p.innerHTML=shell(`<div class="card"><h3>구매 원본</h3><div class="muted">slug: machine-chest-press<br>name: Machine Chest Press<br>equipment: Machine</div></div><div class="family">G Fit 정리층</div><div class="card"><h3>체스트 프레스 머신</h3><div class="muted">영문: Machine Chest Press<br>검색어: 체스트프레스, 머신 체스트 프레스, chest press<br>장비: 머신 · 주요 부위: 가슴</div></div><div class="card"><h3>중복은 이렇게 합침</h3><div class="muted">철자/띄어쓰기/단어 순서만 다르고 실제 동작과 장비가 같음 → 하나의 운동 ID + 여러 검색어</div></div>`);nt.textContent='이름 / 중복 · 원본을 고치지 말고 정리층을 만든다';nl.innerHTML='구매한 metadata는 에셋 원본으로 보존하고, 앱에서 쓰는 <strong>국내 이름·검색어·운동 구분은 별도 정리층</strong>으로 두는 게 안전합니다.';rs.innerHTML='<div class="rule"><b>원본 보존</b><p>source slug/name/설명/파일 경로는 그대로 둡니다. 나중에 에셋 업데이트나 라이선스 확인 때 추적하기 쉽습니다.</p></div><div class="rule"><b>앱용 이름</b><p>국내 헬스장에서 실제로 통하는 이름을 대표 이름으로 두고 영어·다른 표기는 검색어로 연결합니다.</p></div><div class="rule"><b>중복 판정</b><p>이름이 아니라 ‘장비 + 동작 + 각도/자세 + 한쪽/양쪽 + 기록 방식’을 보고 합칩니다.</p></div>';mx.innerHTML='<div><b>합침</b><span>Bench Press (Barbell) / Barbell Bench Press처럼 표현만 다른 경우</span></div><div><b>분리</b><span>Barbell / Smith / Machine / Cable, flat / incline처럼 수행·기록이 달라지는 경우</span></div>';dc.innerHTML='이 기준을 승인하면 다음 단계에서 <strong>실제 metadata 전체에 적용해 국내 이름 / 중복 / 유지 / 제외 후보</strong>를 뽑을 수 있습니다.'}function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='base'?base():m==='machine'?machine():m==='grip'?grip():naming()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('base');</script></body></html>
