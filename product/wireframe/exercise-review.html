<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Fit 운동 DB 검토안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:#fffffff5;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{font-size:12px;color:#6f7782}.top a{padding:7px 10px;border:1px solid #d8dce1;border-radius:6px;background:#fff;color:#39414a;text-decoration:none;font-size:12px}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:800;color:#6c7480}.head h1{margin:6px 0;font-size:28px;line-height:1.25}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{padding:7px 10px;border-radius:999px;background:#eaf9f3;color:#13714f;font-size:11px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:800;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:470px minmax(0,1fr);border:1px solid #cfd4da;background:#fff}.preview{display:flex;justify-content:center;padding:28px 24px 36px;border-right:1px solid #d8dce1;background:#fafbfc}.phone{position:relative;width:360px;height:790px;padding:0 20px 34px;overflow:auto;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#c8c8cc;font-size:11px}.appbar{height:52px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}.appbar span{font-size:14px;font-weight:800}.back{color:#aaa}.search{height:44px;width:100%;border:1px solid #313137;border-radius:10px;background:#161618;color:#f0f0f2;padding:0 12px;font-size:13px}.chips{display:flex;gap:6px;overflow:auto;margin:12px 0 10px;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid #303036;border-radius:999px;background:#161618;color:#bdbdc2;padding:7px 10px;font-size:10px}.chip.on{background:#143d2f;border-color:#34d399;color:#78e8bf}.section{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.section b{font-size:13px}.section span{font-size:10px;color:#777}.row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;min-height:72px;padding:9px;margin-bottom:7px;border-radius:12px;background:#161618;border:1px solid #222228}.thumb{width:58px;height:54px;border-radius:10px;background:linear-gradient(135deg,#f5f7f9,#dfe5ea);display:grid;place-items:center;color:#747c85;font-size:9px;text-align:center}.row b{font-size:12px}.row small{display:block;margin-top:4px;color:#8e8e93;font-size:10px;line-height:1.35}.add{width:42px;height:32px;border:0;border-radius:8px;background:#34d399;color:#07130e;font-size:11px;font-weight:900}.plain{width:100%;height:42px;margin-top:9px;border:1px dashed #404047;border-radius:10px;background:#101012;color:#cfcfd4;font-size:12px;font-weight:800}.detailHero{height:160px;border-radius:14px;background:linear-gradient(135deg,#f7f8fa,#d9e0e6);display:grid;place-items:center;color:#69727d;font-size:12px;margin-bottom:14px}.title{margin:0 0 5px;font-size:22px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{padding:6px 8px;border-radius:999px;background:#1d1d22;color:#bdbdc2;font-size:10px}.info{padding:13px;border-radius:12px;background:#161618;margin-bottom:9px;border:1px solid #232329}.info b{font-size:12px}.info p{margin:6px 0 0;color:#9a9aa1;font-size:10px;line-height:1.5}.cta{width:100%;height:48px;margin-top:10px;border:0;border-radius:10px;background:#34d399;color:#07130e;font-weight:900}.field{margin-bottom:10px}.field label{display:block;margin-bottom:6px;color:#bfbfc4;font-size:11px;font-weight:800}.field input,.field select{width:100%;height:42px;border:1px solid #303036;border-radius:10px;background:#161618;color:#eee;padding:0 11px;font-size:12px}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 22px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:16px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:7px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.flow{margin-top:18px;border:1px solid #d7dbe0;border-radius:10px;overflow:hidden}.flow div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 12px;border-bottom:1px solid #e2e5e8;font-size:12px;line-height:1.5}.flow div:last-child{border:0}.flow span{color:#626a74}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){main{padding:18px 8px}.top{padding:11px 12px}.preview{padding:18px 4px}.phone{width:350px;max-width:100%}.notes{padding:18px 14px}}</style></head><body><header class="top"><div><b>G FIT</b> <span>운동 DB / 운동 추가 검토안</span></div><a href="./index.html">전체 와이어프레임</a></header><main><div class="head"><div><small>EXERCISE DB · REVIEW ONLY</small><h1>운동을 어떻게 찾고 추가하게 할까?</h1><p>루틴 만들기와 운동 중 추가에서 공통으로 쓰는 운동 선택 흐름입니다.</p></div><div class="badge">검토안</div></div><div class="tabs"><button class="on" data-m="search">추천안 · 검색해서 바로 추가</button><button data-m="detail">운동 상세는 필요할 때</button><button data-m="custom">없으면 직접 만들기</button></div><section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="flow" id="flow"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section></main><script>const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),fl=document.getElementById('flow'),dc=document.getElementById('dec');const shell=x=>`<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="appbar"><span class="back">‹</span><span>운동 추가</span><span></span></div>${x}`;function search(){p.innerHTML=shell(`<input class="search" value="체스트" aria-label="검색"><div class="chips"><span class="chip on">전체</span><span class="chip">가슴</span><span class="chip">머신</span><span class="chip">덤벨</span><span class="chip">케이블</span></div><div class="section"><b>검색 결과</b><span>12개</span></div><div class="row"><div class="thumb">운동<br>이미지</div><div><b>체스트 프레스</b><small>머신 · 가슴<br>최근 45kg × 10</small></div><button class="add">추가</button></div><div class="row"><div class="thumb">운동<br>이미지</div><div><b>벤치프레스</b><small>바벨 · 가슴<br>최근 70kg × 10</small></div><button class="add">추가</button></div><div class="row"><div class="thumb">운동<br>이미지</div><div><b>덤벨 체스트 프레스</b><small>덤벨 · 가슴<br>최근 기록 없음</small></div><button class="add">추가</button></div><div class="section"><b>자주 추가한 운동</b><span>개인 기록 기반</span></div><div class="row"><div class="thumb">운동<br>이미지</div><div><b>랫풀다운</b><small>케이블 · 등<br>최근 55kg × 12</small></div><button class="add">추가</button></div><button class="plain">찾는 운동이 없어요 · 직접 만들기</button>`);nt.textContent='추천안 · 검색해서 바로 추가';nl.innerHTML='운동 추가 화면은 <strong>검색이 먼저</strong>이고, 결과 목록에서 바로 추가할 수 있게 합니다.';rs.innerHTML='<div class="rule"><b>왜 이 방식인가</b><p>운동 중에는 빠르게 찾아 넣는 것이 가장 중요합니다. 상세 설명을 매번 보게 만들면 기록 흐름이 느려집니다.</p></div><div class="rule"><b>보여줄 정보</b><p>운동명, 장비, 주요 부위, 최근 기록, 운동 이미지만 먼저 보여줍니다.</p></div><div class="rule"><b>상세 화면</b><p>운동 이름이나 이미지를 눌렀을 때만 열리게 둡니다.</p></div>';fl.innerHTML='<div><b>기본 흐름</b><span>검색 → 목록 → 바로 추가</span></div><div><b>필터</b><span>부위 / 장비 정도만 가볍게 제공</span></div><div><b>없을 때</b><span>직접 만들기로 연결</span></div>';dc.innerHTML='<strong>운동 추가는 검색 중심</strong>으로 가고, 목록에서 바로 추가해도 되는지 보면 됩니다.'}function detail(){p.innerHTML=shell(`<div class="detailHero">운동 이미지 / 타깃 부위</div><h1 class="title">체스트 프레스</h1><div class="meta"><span class="tag">머신</span><span class="tag">가슴</span><span class="tag">삼두 보조</span><span class="tag">중량 기록</span></div><div class="info"><b>최근 기록</b><p>45kg × 10회 · 3세트<br>2026.09.01</p></div><div class="info"><b>운동 방법</b><p>1. 손잡이를 가슴 높이에 맞춥니다.<br>2. 어깨가 들리지 않게 밀어냅니다.<br>3. 팔꿈치를 완전히 잠그지 않습니다.</p></div><div class="info"><b>체크 포인트</b><p>가슴에 힘이 들어오는지 먼저 확인합니다. 어깨 앞쪽 통증이 있으면 중량을 낮춥니다.</p></div><button class="cta">이 운동 추가</button>`);nt.textContent='운동 상세는 필요할 때';nl.innerHTML='상세 화면은 중요하지만, <strong>운동을 추가할 때마다 반드시 거치게 하면 안 됩니다.</strong>';rs.innerHTML='<div class="rule"><b>역할</b><p>운동을 모르는 사람에게 이미지, 설명, 최근 기록을 보여주는 보조 화면입니다.</p></div><div class="rule"><b>기본값</b><p>목록에서 바로 추가 가능. 자세히 보고 싶을 때만 상세로 들어갑니다.</p></div><div class="rule"><b>영상/가이드</b><p>자체 운동 에셋을 기본으로 하고, 검수된 영상은 있으면 보여줍니다.</p></div>';fl.innerHTML='<div><b>목록</b><span>빠른 추가</span></div><div><b>상세</b><span>이미지 / 방법 / 최근 기록 확인</span></div><div><b>추가</b><span>상세에서도 같은 추가 버튼 제공</span></div>';dc.innerHTML='<strong>상세 화면을 필수 단계가 아니라 선택 단계</strong>로 둘지 보면 됩니다.'}function custom(){p.innerHTML=shell(`<div class="info"><b>찾는 운동이 없나요?</b><p>헬스장마다 머신 이름이 다를 수 있어요. 직접 만든 운동도 일반 운동처럼 기록됩니다.</p></div><div class="field"><label>운동 이름</label><input value="해머스트렝스 로우"></div><div class="field"><label>장비</label><select><option>머신</option><option>케이블</option><option>덤벨</option></select></div><div class="field"><label>주요 부위</label><select><option>등</option><option>가슴</option><option>하체</option></select></div><div class="field"><label>기록 방식</label><select><option>중량 + 횟수</option><option>시간</option><option>횟수만</option></select></div><div class="info"><b>나중에 정리 가능</b><p>브랜드 머신, 그립 차이, 대체 운동 묶음은 데이터 정리 단계에서 더 정확히 다룹니다.</p></div><button class="cta">운동 만들고 추가</button>`);nt.textContent='없으면 직접 만들기';nl.innerHTML='G Fit은 고정된 운동 목록만 쓰면 안 됩니다. 실제 헬스장 머신 이름과 구성이 다르기 때문입니다.';rs.innerHTML='<div class="rule"><b>왜 필요한가</b><p>해머스트렝스, 싸이벡스, 부티빌더 같은 머신은 헬스장마다 이름과 구조가 다릅니다.</p></div><div class="rule"><b>MVP 최소 입력</b><p>운동 이름, 장비, 주요 부위, 기록 방식만 먼저 받습니다.</p></div><div class="rule"><b>주의점</b><p>처음부터 브랜드/그립/대체운동까지 전부 입력하게 만들면 너무 무거워집니다.</p></div>';fl.innerHTML='<div><b>못 찾음</b><span>직접 만들기 진입</span></div><div><b>최소 정보</b><span>이름 / 장비 / 부위 / 기록 방식</span></div><div><b>기록</b><span>일반 운동처럼 히스토리 저장</span></div>';dc.innerHTML='<strong>직접 만들기는 MVP에 넣되, 입력 항목은 최소화</strong>하는 방향이 맞는지 보면 됩니다.'}function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='search'?search():m==='detail'?detail():custom()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('search');</script></body></html>
