<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Fit 운동 기록 검토안</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:#fffffff5;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{font-size:12px;color:#6f7782}.top a{padding:7px 10px;border:1px solid #d8dce1;border-radius:6px;background:#fff;color:#39414a;text-decoration:none;font-size:12px}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:800;color:#6c7480}.head h1{margin:6px 0;font-size:28px}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{padding:7px 10px;border-radius:999px;background:#fff4d8;color:#805d00;font-size:11px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:800;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:470px minmax(0,1fr);border:1px solid #cfd4da;background:#fff}.preview{display:flex;justify-content:center;padding:28px 24px 36px;border-right:1px solid #d8dce1;background:#fafbfc}.phone{position:relative;width:360px;min-height:790px;padding:0 20px 86px;overflow:hidden;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#c8c8cc;font-size:11px}.wh{height:62px;display:flex;align-items:center;justify-content:space-between}.wh small{display:block;color:#8e8e93;font-size:10px}.wh h2{margin:2px 0 0;font-size:19px}.end{border:0;background:transparent;color:#f48d8d;font-size:12px;font-weight:800}.prog{display:flex;justify-content:space-between;color:#8e8e93;font-size:10px}.track{height:5px;margin:7px 0 16px;border-radius:99px;background:#232327;overflow:hidden}.track i{display:block;width:42%;height:100%;background:#34d399}.ex{margin-bottom:10px;border:1px solid #2a2a2e;border-radius:14px;background:#161618;overflow:hidden}.ex.cur{border-color:#2d6e57}.eh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px}.eh b{font-size:15px}.eh small{display:block;margin-top:3px;color:#8e8e93;font-size:10px}.menu{border:0;background:transparent;color:#888;font-weight:900}.eb{padding:0 12px 12px}.grid{display:grid;grid-template-columns:34px 1.2fr 1fr 1fr 36px;gap:6px;align-items:center}.grid.h{padding:0 2px 6px;color:#6f6f76;font-size:9px;text-align:center}.row{min-height:42px;margin-bottom:5px;padding:4px 2px;border-radius:8px;background:#111113}.row.done{background:#10221c}.row span,.row small{text-align:center;font-size:10px}.row small{color:#8b8b92}.row input{width:100%;height:32px;border:1px solid #2c2c31;border-radius:7px;background:#1b1b1f;color:#f1f1f2;text-align:center;font-size:12px}.check{width:30px;height:30px;border:1px solid #3a3a40;border-radius:8px;background:#202024;color:#87878e;cursor:pointer;font-weight:900}.done .check{border-color:#2d7659;background:#1a4a39;color:#72e5b8}.addset{width:100%;height:34px;border:0;border-radius:8px;background:#202024;color:#c8c8ce;font-size:11px;font-weight:800}.rest{display:none;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 10px;padding:10px 12px;border:1px solid #315d4d;border-radius:11px;background:#10201b}.rest.show{display:flex}.rest small{display:block;color:#77ba9f;font-size:9px}.rest b{font-size:18px}.rest button{height:30px;border:1px solid #315d4d;border-radius:7px;background:#163127;color:#bfe8d7;font-size:10px;font-weight:800}.next .eh{min-height:64px}.meta{text-align:right;color:#6f6f76;font-size:10px}.meta b{display:block;color:#aaa;font-size:11px}.addex{width:100%;height:44px;border:1px dashed #3a3a40;border-radius:10px;background:transparent;color:#bbb;font-size:12px;font-weight:800}.bottom{position:absolute;left:0;right:0;bottom:0;height:72px;padding:9px 20px;background:#111114;border-top:1px solid #242429;display:grid;grid-template-columns:repeat(4,1fr)}.bottom div{text-align:center;color:#74747b;font-size:15px}.bottom .on{color:#f0f0f2}.bottom small{display:block;margin-top:3px;font-size:9px}.single{padding:16px;border:1px solid #2d6e57;border-radius:14px;background:#161618}.single small{color:#34d399;font-size:10px}.single h2{margin:5px 0 4px;font-size:22px}.single p{margin:0;color:#8e8e93;font-size:11px}.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.pager button{height:42px;border:1px solid #343439;border-radius:9px;background:#202024;color:#ddd;font-size:11px;font-weight:800}.pager .n{border-color:#2d7659;background:#173127;color:#8be4bd}.guide{margin:8px 0 12px;padding:12px;border:1px solid #4e4522;border-radius:10px;background:#292414}.guide b{display:block;margin-bottom:4px;color:#f3cf6d;font-size:11px}.guide p{margin:0;color:#b9ad83;font-size:10px;line-height:1.5}.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.feel button{height:38px;border:1px solid #343439;border-radius:8px;background:#202024;color:#ddd;font-size:10px;font-weight:800}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 22px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:16px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:7px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.rule strong{color:#12704f}.compare{margin-top:18px;border:1px solid #d7dbe0;border-radius:10px;overflow:hidden}.compare div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 12px;border-bottom:1px solid #e2e5e8;font-size:12px;line-height:1.5}.compare div:last-child{border:0}.compare span{color:#626a74}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){main{padding:18px 8px}.top{padding:11px 12px}.preview{padding:18px 4px}.phone{width:350px;max-width:100%}.notes{padding:18px 14px}}</style></head><body><header class="top"><div><b>G FIT</b> <span>운동 기록 이해용 검토안</span></div><a href="./index.html#workout">전체 와이어프레임</a></header><main><div class="head"><div><small>ACTIVE WORKOUT · REVIEW ONLY</small><h1>운동 중에는 빠르게 기록하고, 다음 운동도 한 화면에서 본다</h1><p>추천안과 비교안을 눌러보면 어떤 방식이 실제 헬스장에서 더 편할지 비교할 수 있습니다.</p></div><div class="badge">아직 확정 아님</div></div><div class="tabs"><button class="on" data-m="all">추천안 · 전체 운동</button><button data-m="single">비교 · 한 종목씩</button><button data-m="first">처음 하는 운동</button></div><section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section></main><script>const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),dc=document.getElementById('dec');const shell=x=>`<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="wh"><div><small>18:24 진행 중</small><h2>하체 루틴</h2></div><button class="end">운동 종료</button></div><div class="prog"><span>운동 진행률</span><span>8 / 19세트</span></div><div class="track"><i></i></div>${x}<div class="bottom"><div>⌂<small>홈</small></div><div>▤<small>루틴</small></div><div class="on">●<small>운동 중</small></div><div>⚙<small>설정</small></div></div>`;const rows=()=>`<div class="grid h"><span>세트</span><span>이전</span><span>kg</span><span>횟수</span><span></span></div><div class="grid row done"><span>1</span><small>100×12</small><input value="105"><input value="12"><button class="check">✓</button></div><div class="grid row"><span>2</span><small>100×12</small><input value="105"><input value="11"><button class="check">○</button></div><div class="grid row"><span>3</span><small>100×10</small><input value="105"><input value="10"><button class="check">○</button></div><button class="addset">+ 세트 추가</button>`;function wire(){document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{const r=b.closest('.row'),d=!r.classList.contains('done');r.classList.toggle('done',d);b.textContent=d?'✓':'○';const t=document.getElementById('rest');if(t&&d)t.classList.add('show')})}function all(){p.innerHTML=shell(`<div class="ex cur"><div class="eh"><div><b>레그 프레스</b><small>이전 기록을 옆에서 바로 참고</small></div><button class="menu">•••</button></div><div class="eb">${rows()}</div></div><div class="rest" id="rest"><div><small>휴식 타이머</small><b>01:24</b></div><div><button>-15초</button> <button>+15초</button> <button>건너뛰기</button></div></div><div class="ex next"><div class="eh"><div><b>레그 컬</b><small>다음 운동</small></div><div class="meta"><b>45kg</b>12 · 11 · 10</div></div></div><div class="ex next"><div class="eh"><div><b>카프 레이즈</b><small>그다음 운동</small></div><div class="meta"><b>60kg</b>15 · 14 · 13</div></div></div><button class="addex">+ 운동 추가</button>`);wire();nt.textContent='왜 이 구조를 추천하나';nl.innerHTML='현재 운동은 크게 기록하고, <strong>다음 운동은 아래에 계속 보이게</strong> 하는 방식입니다.';rs.innerHTML='<div class="rule"><b>현재 운동만 크게 펼침</b><p>세트, 이전 기록, kg, 횟수를 한곳에 둡니다.</p></div><div class="rule"><b>다음 운동은 접어서 보임</b><p>화면을 따로 바꾸지 않고 아래로 내려 바로 이동할 수 있습니다.</p></div><div class="rule"><b>휴식 타이머는 작게</b><p>세트의 ○ 버튼을 눌러보세요. 타이머가 화면을 가리지 않고 나타납니다.</p></div><div class="compare"><div><b>장점</b><span>기록이 빠르고 운동 순서 변경이나 건너뛰기가 쉽다.</span></div><div><b>주의점</b><span>정보가 많아 보일 수 있어 현재 운동만 펼치는 정리가 필요하다.</span></div></div>';dc.innerHTML='“운동 중에는 <strong>모든 운동을 한 화면에 두고 현재 운동만 펼치는 방식</strong>이 좋은가?”만 보면 됩니다.'}function single(){p.innerHTML=shell(`<div class="single"><small>2 / 6 운동</small><h2>레그 프레스</h2><p>한 운동을 크게 보고 다음 버튼으로 넘어가는 방식</p><div style="margin-top:18px">${rows()}</div><div class="pager"><button>‹ 이전 운동</button><button class="n">다음 운동 ›</button></div></div>`);wire();nt.textContent='비교안 · 한 종목씩 보기';nl.innerHTML='화면은 단순하지만 <strong>다음 운동 확인이나 순서 변경 때 이동이 늘어나는 방식</strong>입니다.';rs.innerHTML='<div class="rule"><b>좋은 점</b><p>한 화면에 정보가 적어 처음 봤을 때 단순합니다.</p></div><div class="rule"><b>불편할 수 있는 점</b><p>다음 운동 확인, 운동 건너뛰기, 순서 변경 때 화면 이동이 많아집니다.</p></div><div class="compare"><div><b>추천안</b><span>현재 운동과 다음 운동들이 한 화면에 연결됨</span></div><div><b>비교안</b><span>운동 하나마다 별도 화면처럼 사용</span></div></div>';dc.innerHTML='깔끔함보다 실제 운동 중 <strong>기록 속도와 자유로운 이동</strong>이 더 중요한지 비교해 보면 됩니다.'}function first(){p.innerHTML=shell(`<div class="ex cur"><div class="eh"><div><b>체스트 프레스</b><small>이전 기록 없음 · 목표 8–12회</small></div><button class="menu">•••</button></div><div class="eb"><div class="guide"><b>처음 하는 운동이에요</b><p>무리하지 않는 가벼운 중량으로 시작해 8–12회를 해보세요.</p></div><div class="grid h"><span>세트</span><span>이전</span><span>kg</span><span>횟수</span><span></span></div><div class="grid row"><span>1</span><small>-</small><input value="30"><input value="10"><button class="check">○</button></div><div class="feel"><button>가벼웠어요</button><button>적당했어요</button><button>무거웠어요</button></div></div></div><div class="ex next"><div class="eh"><div><b>랫풀다운</b><small>다음 운동</small></div><div class="meta"><b>45kg</b>10회</div></div></div>`);wire();nt.textContent='처음 하는 운동도 같은 화면 안에서';nl.innerHTML='별도 설명 화면으로 보내지 않고 <strong>실제 기록 화면 안에서 짧게 안내</strong>합니다.';rs.innerHTML='<div class="rule"><b>이전 기록 없음 표시</b><p>처음 하는 운동이라는 걸 바로 알 수 있게 합니다.</p></div><div class="rule"><b>가벼운 시작 중량 안내</b><p>고정 kg를 정해주지 않고 무리 없이 시작하도록 안내합니다.</p></div><div class="rule"><b>첫 세트 후 느낌만 묻기</b><p>가벼움 / 적당함 / 무거움 정도만 받아 다음 세트 조정에 도움을 줍니다.</p></div>';dc.innerHTML='이 상태는 이미 정한 정책을 시각화한 참고예요. 핵심 결정은 <strong>추천안과 한 종목씩 보기 중 어떤 기본 구조가 좋은지</strong>입니다.'}function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='all'?all():m==='single'?single():first()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('all');</script></body></html>
