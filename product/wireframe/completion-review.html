<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G Fit 운동 완료 화면 검토안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242a;font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:#fffffff5;border-bottom:1px solid #d8dce1}.top b{font-size:18px}.top span{font-size:12px;color:#6f7782}.top a{padding:7px 10px;border:1px solid #d8dce1;border-radius:6px;background:#fff;color:#39414a;text-decoration:none;font-size:12px}main{max-width:1320px;margin:auto;padding:28px 24px 72px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:16px;border-bottom:2px solid #252a31}.head small{font-size:11px;font-weight:800;color:#6c7480}.head h1{margin:6px 0;font-size:28px;line-height:1.25}.head p{margin:0;color:#6f7782;font-size:14px;line-height:1.55}.badge{padding:7px 10px;border-radius:999px;background:#fff4d8;color:#805d00;font-size:11px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.tabs button{padding:9px 13px;border:1px solid #cdd2d8;border-radius:8px;background:#fff;color:#545c66;font-size:13px;font-weight:800;cursor:pointer}.tabs .on{border-color:#1d8f68;background:#eaf9f3;color:#13714f}.layout{display:grid;grid-template-columns:470px minmax(0,1fr);border:1px solid #cfd4da;background:#fff}.preview{display:flex;justify-content:center;padding:28px 24px 36px;border-right:1px solid #d8dce1;background:#fafbfc}.phone{position:relative;width:360px;height:790px;padding:0 20px 34px;overflow:auto;border-radius:26px;background:#0a0a0c;color:#f0f0f2;box-shadow:0 12px 30px #191e261f}.status{height:34px;display:flex;align-items:center;justify-content:space-between;color:#c8c8cc;font-size:11px}.appbar{height:52px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}.appbar span{font-size:14px;font-weight:800}.back{color:#aaa}.done{padding:20px 18px;border:1px solid #2d2d31;border-radius:14px;background:#161618;text-align:center}.done .icon{width:48px;height:48px;margin:0 auto 10px;display:grid;place-items:center;border-radius:50%;background:#173d30;color:#69deb1;font-size:22px}.done h2{margin:0 0 5px;font-size:22px}.done p{margin:0;color:#8e8e93;font-size:11px;line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.metric{padding:13px 8px;border-radius:10px;background:#202024;text-align:left}.metric b{display:block;font-size:20px}.metric small{display:block;margin-top:4px;color:#85858c;font-size:10px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.section b{font-size:13px}.section span{font-size:10px;color:#777}.highlight{padding:12px;margin-bottom:7px;border:1px solid #2f6f59;border-radius:10px;background:#10211b}.highlight b{display:block;color:#75e3b7;font-size:12px}.highlight p{margin:5px 0 0;color:#a3caba;font-size:10px;line-height:1.45}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:49px;padding:10px;margin-bottom:6px;border-radius:10px;background:#161618}.row b{font-size:12px}.row small{display:block;margin-top:3px;color:#8e8e93;font-size:10px}.row strong{font-size:11px;color:#cfcfd4}.save{margin-top:14px;padding:15px;border:1px solid #315d4d;border-radius:12px;background:#10211b}.save h3{margin:0 0 5px;font-size:15px}.save p{margin:0;color:#9db9ad;font-size:10px;line-height:1.5}.cta{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:#34d399;color:#07130e;font-weight:900}.sub{width:100%;height:40px;margin-top:8px;border:1px solid #38383d;border-radius:10px;background:transparent;color:#cfcfd4;font-size:11px;font-weight:800}.chart{height:76px;padding:10px;border-radius:10px;background:#202024;display:flex;align-items:end;gap:6px}.bar{flex:1;border-radius:5px 5px 0 0;background:#34d39933;border:1px solid #34d39966}.notes{padding:24px}.notes h2{margin:0 0 6px;font-size:20px}.lead{margin:0 0 22px;color:#6f7782;font-size:13px;line-height:1.6}.rule{padding:16px 0;border-top:1px solid #e0e3e7}.rule:first-of-type{border-top:0}.rule b{display:block;margin-bottom:7px;font-size:14px}.rule p{margin:0;color:#505862;font-size:13px;line-height:1.55}.rule strong{color:#12704f}.decision{margin-top:20px;padding:16px;border:1px solid #b9e5d2;border-radius:10px;background:#eef9f4}.decision b{display:block;margin-bottom:5px;color:#12694b}.decision p{margin:0;color:#355448;font-size:13px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{border-right:0;border-bottom:1px solid #d8dce1}.head{align-items:flex-start;flex-direction:column}}@media(max-width:430px){main{padding:18px 8px}.top{padding:11px 12px}.preview{padding:18px 4px}.phone{width:350px;max-width:100%}.notes{padding:18px 14px}}
</style>
</head>
<body>
<header class="top"><div><b>G FIT</b> <span>운동 완료 화면 검토안</span></div><a href="./index.html#complete">전체 와이어프레임</a></header>
<main>
<div class="head"><div><small>POST WORKOUT · REVIEW ONLY</small><h1>운동을 끝냈을 때 무엇을 먼저 보여줄까?</h1><p>완료 화면은 오늘 운동 결과를 확인하고 다음 행동으로 넘어가게 하는 화면입니다.</p></div><div class="badge">검토안</div></div>
<div class="tabs"><button class="on" data-m="today">추천안 · 오늘 결과 중심</button><button data-m="simple">비교 · 아주 간단히</button><button data-m="analysis">비교 · 분석까지 많이</button></div>
<section class="layout"><div class="preview"><div class="phone" id="phone"></div></div><aside class="notes"><h2 id="nt"></h2><p class="lead" id="nl"></p><div id="rules"></div><div class="decision"><b>지금 판단할 것</b><p id="dec"></p></div></aside></section>
</main>
<script>
const p=document.getElementById('phone'),bs=[...document.querySelectorAll('[data-m]')],nt=document.getElementById('nt'),nl=document.getElementById('nl'),rs=document.getElementById('rules'),dc=document.getElementById('dec');
const shell=x=>`<div class="status"><span>9:41</span><span>● ● ●</span></div><div class="appbar"><span class="back">‹</span><span>운동 완료</span><span></span></div>${x}`;
function today(){p.innerHTML=shell(`<div class="done"><div class="icon">✓</div><h2>운동 완료</h2><p>오늘 하체 루틴을 마쳤어요.</p><div class="metrics"><div class="metric"><b>52분</b><small>운동 시간</small></div><div class="metric"><b>18세트</b><small>완료 세트</small></div><div class="metric"><b>8,420kg</b><small>총 기록 중량</small></div><div class="metric"><b>6개</b><small>운동 종목</small></div></div></div><div class="section"><b>오늘의 변화</b><span>2개</span></div><div class="highlight"><b>레그프레스 최고 기록</b><p>지난 하체 운동보다 10kg 더 기록했어요.</p></div><div class="highlight"><b>벤치프레스 반복수 증가</b><p>같은 중량에서 1회 더 수행했어요.</p></div><div class="section"><b>운동 결과</b><span>요약</span></div><div class="row"><div><b>레그프레스</b><small>105kg · 12 / 11 / 10회</small></div><strong>3세트</strong></div><div class="row"><div><b>레그 컬</b><small>45kg · 12 / 11 / 10회</small></div><strong>3세트</strong></div><div class="row"><div><b>카프 레이즈</b><small>60kg · 15 / 14 / 13회</small></div><strong>3세트</strong></div><div class="save"><h3>추천 루틴으로 시작했다면</h3><p>여기에서 “다음에도 할지”를 묻습니다. 평소 직접 만든 루틴이면 이 영역은 숨깁니다.</p><button class="cta">내 루틴에 저장</button><button class="sub">이번만 하기</button></div>`);nt.textContent='추천안 · 오늘 결과 중심';nl.innerHTML='완료 화면은 <strong>오늘 운동을 잘 끝냈다는 확인</strong>과 <strong>오늘의 의미 있는 변화</strong>를 먼저 보여줍니다.';rs.innerHTML='<div class="rule"><b>보상감이 먼저</b><p>시간, 세트, 기록 중량, 운동 수를 한눈에 보여줍니다.</p></div><div class="rule"><b>깊은 분석은 적게</b><p>장기 그래프나 부위별 추세는 분석 탭에서 다룹니다.</p></div><div class="rule"><b>추천 루틴 저장은 조건부</b><p>추천 루틴으로 시작한 경우에만 하단에서 저장 여부를 묻습니다.</p></div>';dc.innerHTML='<strong>운동 완료 화면은 오늘 결과 중심</strong>으로 두고, 장기 분석은 분석 탭으로 보내도 되는지 보면 됩니다.'}
function simple(){p.innerHTML=shell(`<div class="done"><div class="icon">✓</div><h2>완료</h2><p>오늘 운동을 저장했어요.</p><div class="metrics"><div class="metric"><b>52분</b><small>운동 시간</small></div><div class="metric"><b>18세트</b><small>완료 세트</small></div></div></div><button class="cta">홈으로 가기</button><button class="sub">기록 자세히 보기</button>`);nt.textContent='비교안 · 아주 간단히';nl.innerHTML='가장 빠르지만 <strong>운동을 끝낸 보상감과 성장 확인</strong>이 약합니다.';rs.innerHTML='<div class="rule"><b>좋은 점</b><p>화면이 짧고 이해가 쉽습니다.</p></div><div class="rule"><b>아쉬운 점</b><p>운동 기록 앱의 핵심인 “내가 좋아졌는지”를 바로 느끼기 어렵습니다.</p></div>';dc.innerHTML='단순함을 위해 <strong>오늘의 변화와 세부 결과</strong>를 거의 안 보여줘도 되는지 비교하면 됩니다.'}
function analysis(){p.innerHTML=shell(`<div class="done"><div class="icon">✓</div><h2>운동 완료</h2><p>오늘 운동과 이번 주 분석을 함께 보여줍니다.</p><div class="metrics"><div class="metric"><b>52분</b><small>운동 시간</small></div><div class="metric"><b>8,420kg</b><small>총 기록 중량</small></div></div></div><div class="section"><b>이번 주 추세</b><span>분석</span></div><div class="chart"><div class="bar" style="height:44%"></div><div class="bar" style="height:62%"></div><div class="bar" style="height:36%"></div><div class="bar" style="height:72%"></div><div class="bar" style="height:52%"></div></div><div class="section"><b>부위별 수행량</b><span>분석</span></div><div class="row"><div><b>하체</b><small>이번 주 42세트</small></div><strong>높음</strong></div><div class="row"><div><b>가슴</b><small>이번 주 18세트</small></div><strong>보통</strong></div><div class="row"><div><b>등</b><small>이번 주 12세트</small></div><strong>낮음</strong></div><div class="section"><b>운동 결과</b><span>오늘</span></div><div class="row"><div><b>레그프레스</b><small>105kg · 12 / 11 / 10회</small></div><strong>3세트</strong></div>`);nt.textContent='비교안 · 분석까지 많이';nl.innerHTML='정보는 많지만 완료 직후 화면이 <strong>분석 탭처럼 무거워질 위험</strong>이 있습니다.';rs.innerHTML='<div class="rule"><b>좋은 점</b><p>운동 직후 많은 정보를 바로 볼 수 있습니다.</p></div><div class="rule"><b>문제점</b><p>오늘 운동 완료 확인, 추천 루틴 저장 같은 다음 행동이 묻힐 수 있습니다.</p></div><div class="rule"><b>분석 탭과 역할 중복</b><p>장기 추세는 별도 분석 탭에서 더 잘 다룰 수 있습니다.</p></div>';dc.innerHTML='완료 화면에 <strong>주간 그래프와 부위 분석까지 많이 넣을지</strong> 비교하면 됩니다.'}
function render(m){bs.forEach(b=>b.classList.toggle('on',b.dataset.m===m));m==='today'?today():m==='simple'?simple():analysis()}bs.forEach(b=>b.onclick=()=>render(b.dataset.m));render('today');
</script>
</body>
</html>
